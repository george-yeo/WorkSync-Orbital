<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1e4636" />
    <meta
      name="description"
      content="WorkSync: shared task lists, group chat and a SyncTree that grows as your team gets things done."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>WorkSync</title>
    <script>
      // Apply a pinned colour scheme before first paint (see ThemeToggle).
      try {
        const scheme = localStorage.getItem('color-scheme')
        if (scheme === 'light' || scheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = scheme
          document.documentElement.dataset.theme = scheme
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
